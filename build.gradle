plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Blockstates, item models, lang, recipes, loot and tags come from datagen: run `runData` and commit src/generated
sourceSets.main.resources {
    srcDir('src/generated/resources')
    // Patterns are relative to each resource folder; datagen's cache sits at the top of src/generated/resources
    exclude('.cache/**')
}

// Dev runs load the build folders, so the game tests and their template stay out of the jar and work as before in
// runGameTestServer
tasks.named('jar', Jar) {
    exclude('com/goldskinmc/createdecals/gametest/**')
    exclude('data/createdecals/structure/**')
}

repositories {
    mavenCentral()
    // Create, Ponder, Flywheel
    maven { url = 'https://maven.createmod.net' }
    // Registrate
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    // Veil (Sable's rendering library), dev runs only
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter {
            includeGroup 'foundry.veil'
            includeGroup 'gg.moonflower'
            includeGroup 'io.github.ocelot'
        }
    }
    // Modrinth's Maven: Sodium, Iris, spark and the test shader pack, dev runs only
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Sable and Sable Companion, dev runs only
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter {
            includeGroup 'dev.ryanhcode.sable'
            includeGroup 'dev.ryanhcode.sable-companion'
        }
    }
}

// Dev runtime profile, set with -Prun_profile=<name>:
//   latest (default) newest Create and Sable (test vehicles)
//   floor            oldest supported stack: NeoForge 21.1.125 and Create 6.0.0, no Sable
def runProfile = providers.gradleProperty('run_profile').getOrElse('latest')
if (!(runProfile in ['latest', 'floor'])) {
    throw new GradleException("Unknown run_profile '${runProfile}'; use latest or floor")
}
def floorRun = runProfile == 'floor'
// Each profile keeps its own game directory, so worlds never load with mods they were not made with
def runDir = floorRun ? 'run-floor' : providers.gradleProperty('dev_sable').map { it.toBoolean() }.getOrElse(true) ? 'run' : 'run-nosable'
// -Pdev_perf=true adds Sodium, Iris and spark (shader and frame-cost checks); -Pdev_iris=false leaves Iris out
def devPerf = providers.gradleProperty('dev_perf').map { it.toBoolean() }.getOrElse(false)
def devIris = providers.gradleProperty('dev_iris').map { it.toBoolean() }.getOrElse(true)
// -Pdev_copycats=true adds Copycats+ (the most used copycat add-on) to check both run side by side: dev only, never shipped
def devCopycats = providers.gradleProperty('dev_copycats').map { it.toBoolean() }.getOrElse(false)
// -Pdev_tools=true adds JEI and The One Probe to `latest` runs, for playing by hand: dev only, never shipped
def devTools = providers.gradleProperty('dev_tools').map { it.toBoolean() }.getOrElse(false)
// -Pdev_sable=false leaves Sable and Veil out of `latest` runs (to tell their effects from ours)
def devSable = providers.gradleProperty('dev_sable').map { it.toBoolean() }.getOrElse(true)

neoForge {
    version = floorRun ? project.neo_floor_version : project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            jvmArgument '-Xmx4G'
            // -Pwindow=1920x1080 opens the game at that size (screenshots are taken at the window's size)
            def window = providers.gradleProperty('window').getOrElse('1280x720')
            def (width, height) = window.tokenize('x')
            programArguments.addAll '--width', width, '--height', height
            // -Pquickplay_server=localhost joins that server instead of opening the test world (dedicated-server checks)
            def quickPlayServer = providers.gradleProperty('quickplay_server').getOrNull()
            if (quickPlayServer != null) {
                programArguments.addAll '--quickPlayMultiplayer', quickPlayServer
            }
        }
        // A dedicated server in run-server/ (superflat, offline mode, EULA accepted by the owner)
        server {
            server()
            programArgument '--nogui'
        }
        // Headless check: boots every mod, runs the game tests, exits
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            // The dedicated server gets its own folder, so its log and world never clash with a client's
            gameDirectory = file(name == 'server' ? "${runDir}-server" : runDir)
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Present in dev runs, never published as a dependency
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Compile on the floor: 6.0.0's full jar bundles its own Ponder, Flywheel and Registrate
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_floor_version}") { transitive = false }
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_floor_version}"
    // Copycats+, optional: compiled against for compat/copycats only (its public foundation package; ArchitectureTest)
    compileOnly("maven.modrinth:copycats:${copycats_version}") { transitive = false }
    compileOnly "com.tterrag.registrate:Registrate:${registrate_floor_version}"

    if (floorRun) {
        localRuntime("com.simibubi.create:create-${minecraft_version}:${create_floor_version}") { transitive = false }
        // With -Pcopycats_version=yJiPTmhu (3.0.1, the oldest for 1.21.1, which says it takes Create 6.0.0 on; later ones
        // need 6.0.8): Copycats+ on the oldest Create
        if (devCopycats) {
            localRuntime("maven.modrinth:copycats:${copycats_version}") { transitive = false }
        }
    } else {
        localRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
        localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
        localRuntime "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
        localRuntime "com.tterrag.registrate:Registrate:${registrate_version}"

        // Non-transitive: Sable's POM pulls the full Create jar, which would load Create twice
        if (devSable) {
            localRuntime("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
            localRuntime "dev.ryanhcode.sable:sable-sable_rapier-${minecraft_version}:${sable_version}"
            localRuntime "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
            localRuntime "foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}"
        }

        if (devCopycats) {
            localRuntime("maven.modrinth:copycats:${copycats_version}") { transitive = false }
        }
        // -Pdev_conflicts=immediatelyfast,entityculling,sodium-extra adds mods big Create packs ship (All of Create
        // Aeronautics has all three) that change how things are drawn: ImmediatelyFast batches screen drawing, Entity
        // Culling skips what it thinks is hidden, Sodium Extra (needs -Pdev_perf) changes Sodium's options. The same
        // versions Lightworks tests against; dev only, never shipped
        def conflictMods = [
                'immediatelyfast': "maven.modrinth:immediatelyfast:${immediatelyfast_version}",
                'entityculling'  : "maven.modrinth:entityculling:${entityculling_version}",
                'sodium-extra'   : "maven.modrinth:sodium-extra:${sodium_extra_version}",
        ]
        providers.gradleProperty('dev_conflicts').map { it.split(',')*.trim() as Set }.getOrElse([] as Set).each { name ->
            if (!conflictMods.containsKey(name)) {
                throw new GradleException("Unknown dev_conflicts mod '${name}'; use ${conflictMods.keySet().join(', ')}")
            }
            if (name == 'sodium-extra' && !devPerf) {
                throw new GradleException('sodium-extra needs -Pdev_perf=true (Sodium)')
            }
            localRuntime(conflictMods[name]) { transitive = false }
        }
        if (devTools) {
            localRuntime("maven.modrinth:jei:${jei_version}") { transitive = false }
            localRuntime("maven.modrinth:the-one-probe:${the_one_probe_version}") { transitive = false }
        }
        if (devPerf) {
            if (devIris) {
                localRuntime("maven.modrinth:iris:${iris_version}") { transitive = false }
            }
            localRuntime("maven.modrinth:spark:${spark_version}") { transitive = false }
        }
    }

    // Pure-logic and architecture tests: no game boot
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Puts Complementary Reimagined into this profile's shaderpacks folder for the shader checks.
// Its licence allows personal use; it is never bundled or redistributed.
configurations {
    shaderpack
}
dependencies {
    shaderpack "maven.modrinth:complementary-reimagined:${shaderpack_version}@zip"
}
tasks.register('installShaderpack', Copy) {
    group = 'mod development'
    description = 'Installs the test shader pack into the current run profile'
    from configurations.shaderpack
    into "${runDir}/shaderpacks"
}

// Sodium's jar is a launcher service that loads the real mod from inside itself. That only works from a
// mods folder, not the dev classpath, so -Pdev_perf runs copy it into the profile's mods/ as dev-perf-*.jar.
// Other runs remove it again; any other file in mods/ is left alone.
configurations {
    devPerfMods
}
dependencies {
    devPerfMods("maven.modrinth:sodium:${sodium_version}") { transitive = false }
}
tasks.register('syncDevPerfMods') {
    // Not a Sync: with nothing to copy, a Sync is skipped as NO-SOURCE and never deletes the old jar
    def modsDir = file("${runDir}/mods")
    def jars = devPerf && !floorRun ? configurations.devPerfMods : files()
    inputs.files(jars)
    outputs.upToDateWhen { false }
    doLast {
        modsDir.mkdirs()
        modsDir.listFiles().findAll { it.name.startsWith('dev-perf-') }.each { it.delete() }
        jars.each { jar ->
            java.nio.file.Files.copy(jar.toPath(), new File(modsDir, "dev-perf-${jar.name}").toPath())
        }
    }
}
tasks.withType(JavaExec).configureEach {
    if (name.startsWith('run')) {
        dependsOn 'syncDevPerfMods'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Optional local additions for development, kept outside this repository: -Pdecals_dev_extras=<path to a Gradle script>
// (or decals_dev_extras in ~/.gradle/gradle.properties) applies that script last
def devExtras = providers.gradleProperty('decals_dev_extras').getOrElse('')
if (!devExtras.isBlank() && file(devExtras).exists()) {
    apply from: devExtras
}
