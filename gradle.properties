org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Version policy: compile against the oldest version we support ("floor"), run dev on the newest.
# Dev runtime profiles (-Prun_profile=...): latest (default, with Sable), floor (NeoForge 21.1.125 and Create 6.0.0).

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.228
# What Create 6.0.0 requires; used by floor runs
neo_floor_version=21.1.125
neo_version_range=[21.1.125,)
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Create 6
create_version_range=[6.0.0,6.1.0)
# Floor: compiled against. 6.0.0 has no slim jar; its full jar bundles Ponder, Flywheel and Registrate
create_floor_version=6.0.0-4
flywheel_floor_version=1.0.0-9
registrate_floor_version=MC1.21-1.3.0+62
# Latest public release, used in dev runs
create_version=6.0.10-280
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
ponder_version=1.0.82

## Dev runs only (the same versions Lightworks runs with)
# Sable and its libraries: test vehicles are made with Sable's commands, no code refers to it
sable_version=2.0.6
veil_version=4.3.2
sable_companion_version=1.6.0
# -Pdev_perf=true: Sodium, Iris, spark
sodium_version=mc1.21.1-0.8.13-neoforge
iris_version=1.8.14-beta.1+1.21.1-neoforge
spark_version=1.10.124-neoforge-1.21.1
# Complementary Reimagined, installed by installShaderpack; personal-use licence, never bundled
shaderpack_version=r5.9.3
# Copycats+, pinned by Modrinth version id (as in Lightworks): compiled against for its copycats' decals (compat/copycats);
# -Pdev_copycats=true also loads it in dev runs
copycats_version=bPYeUWZx
# -Pdev_tools=true: JEI and The One Probe, the same as Lightworks'. JEI is pinned by Modrinth version id (19.39.0.372 for
# NeoForge): its version numbers are shared with the Forge build
jei_version=zHNxmOqp
the_one_probe_version=1.21_neo-12.0.8

## Mod
# Final name (owner, Nov 6, 2026)
mod_id=createdecals
mod_name=Create: Decals
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.goldskinmc.createdecals
