modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Goldsk1n/CreateDecals/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "GoldskinMC"
description = '''
Decals for Create's copycat blocks.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

# Optional: its copycats take decals too (compat/copycats; only its public foundation package). 3.0.1 is its oldest
# release for NeoForge 1.21.1: tested with it on Create 6.0.0 and with 3.0.9 and 3.0.11 on 6.0.10
[[dependencies.${mod_id}]]
modId = "copycats"
type = "optional"
versionRange = "[3.0.1,)"
ordering = "AFTER"
side = "BOTH"
